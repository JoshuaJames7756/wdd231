<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Joshua">
  <meta name="description" content="Browse the full book catalog at The Page & Ink Bookstore, filterable by genre.">

  <meta property="og:title" content="Catalog | The Page & Ink Bookstore">
  <meta property="og:description" content="Browse and filter our full book catalog by genre.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="images/og-cover.jpg">

  <title>Catalog | The Page & Ink Bookstore</title>
  <link rel="icon" href="images/favicon.ico">
  <link rel="stylesheet" href="styles/global.css">
  <link rel="stylesheet" href="styles/catalog.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">The Page &amp; Ink</a>
      <button class="nav-toggle" aria-expanded="false" aria-label="Toggle navigation menu">&#9776;</button>
      <nav class="primary-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="catalog.html">Catalog</a></li>
          <li><a href="contact.html">Contact &amp; Pre-Order</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>

    <h1>Catalog</h1>

    <div class="catalog-controls">
      <label for="genre-filter">Filter by genre:</label>
      <select id="genre-filter">
        <option value="all">All genres</option>
      </select>
      <p id="results-count" aria-live="polite"></p>
    </div>

    <section id="book-grid" class="book-grid" aria-live="polite">
      <p class="loading-message">Loading books&hellip;</p>
    </section>

  </main>

  <!-- Modal dialog for book detail -->
  <dialog id="book-modal">
    <button id="modal-close" aria-label="Close details">&times;</button>
    <div id="modal-content"></div>
  </dialog>

  <footer class="site-footer">
    <p>&copy; 2026 The Page &amp; Ink Bookstore</p>
    <div class="footer-links">
      <a href="attributions.html">Attributions</a>
      <a href="#" target="_blank" rel="noopener">Video Demo</a>
    </div>
  </footer>

  <!-- VIDEO: point out type="module" here -->
  <script type="module" src="scripts/main.js"></script>
  <script type="module" src="scripts/catalog.js"></script>
</body>
</html>
